name: ZET GTFS-Realtime Data Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: zet-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Continuous GTFS Data Collection Shift
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Validate System & Environment
        run: bun run validate

      - name: Run Collection Pipeline Shift (55 minutes)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_MAX_RUN_TIME_MS: "3300000" # 55 minutes
          POLL_INTERVAL_MS: "10000" # 10 seconds
          EXPORT_INTERVAL_MS: "3300000" # 55 minutes
        run: bun run src/index.ts

      - name: Commit & Push Final Parquet Data
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git rebase --abort >/dev/null 2>&1 || true
          rm -rf .git/rebase-merge .git/rebase-apply || true

          git fetch origin main
          git checkout -B main origin/main

          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data(collect): hourly Parquet dataset update [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin HEAD:main
          else
            echo "No data changes to commit."
          fi
